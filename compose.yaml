services:
  kairos:
    image: ghcr.io/asano69/kairos:latest
    container_name: kairos
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - kairos.env
    volumes:
      - ./data:/kairos/pb_data
        #- /etc/ssl/certs/root_ca.crt:/certs/root_ca.crt:ro # optional
    environment:
      - TZ=Etc/UTC
      #
      - KAIROS_SERVER_HOST=0.0.0.0
      - KAIROS_SERVER_PORT=3000
      - KAIROS_DATA_DIR=pb_data
      #
      #- INITIAL_ADMIN_EMAIL=admin@mail.internal # default
      #- INITIAL_ADMIN_PASSWORD=password # default
volumes:
  data:
